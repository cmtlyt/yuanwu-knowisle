name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支串行，避免重叠部署；新建 run 排队而非取消在跑的部署
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

# 最小权限：只读仓库即可（部署走 Cloudflare API Token）
permissions:
  contents: read

jobs:
  test:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Verify course data
        run: pnpm verify

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    # 仅 main 分支 + 非 PR 才进入本 job。
    # GitHub 的 if 条件（job 级与 step 级）都不能引用 secrets 上下文（解析期报
    # "Unrecognized named-value: 'secrets'" 导致 0 job）。故把 secret 经 job 级
    # env 映射（带 not-set 兜底，env 上下文允许引用 secrets），再在 step 级 if
    # 检查 env。未配密钥时 deploy step 跳过，不会误上线。
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || 'not-set' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'not-set' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy (build + wrangler deploy)
        # 未配置 Cloudflare Token 时本 step 跳过（env 哨兵 not-set 检测；
        # if 表达式不能引用 secrets，故经 job 级 env 映射后再判）；不会误上线。
        if: ${{ env.CLOUDFLARE_API_TOKEN != 'not-set' }}
        run: pnpm deploy
